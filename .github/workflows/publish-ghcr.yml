name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "worker/**", "db/**", "redis/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_SHA: 6c057e1af2d266a2ec5ab4b660a8232ddc31cde3
  TAG: 6c057e1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thomasunise/argus
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upstream image (unmodified upstream Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/onepush-dev/argus-secops
          tags: ghcr.io/onepush-dev/argus-secops-base:${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/argus-secops:${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/argus-secops-worker:${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/argus-secops-db:16
      - uses: docker/build-push-action@v6
        with:
          context: redis
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/argus-secops-redis:7.4
